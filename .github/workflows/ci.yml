name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  GORELEASER_VERSION: v2.19.0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes are expensive in a private repository, so it runs only
        # for pushes to main. A pull request has a ref of refs/pull/N/merge.
        os: ${{ github.ref == 'refs/heads/main' && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: Build and run doctor
        shell: bash
        run: |
          go build -o backupclaude-ci.exe ./cmd/backupclaude
          ./backupclaude-ci.exe --version
          # Exit code 1 only means problems were found: Linux runners have no
          # key store. Anything else is a crash.
          set +e
          ./backupclaude-ci.exe doctor --json
          code=$?
          set -e
          test "$code" -le 1

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan the whole history
        run: ./gitleaks git --redact --verbose --no-banner --exit-code 1 .

  goreleaser:
    name: GoReleaser snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean

  e2e-windows:
    name: end-to-end (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        run: go build -o backupclaude-e2e.exe ./cmd/backupclaude
      # A clean Windows: install from a local archive, setup, made-up data,
      # backup, deleted files, restore, comparison of hashes, update, uninstall.
      - name: Install, setup, backup, restore, uninstall
        shell: pwsh
        run: ./scripts/e2e-windows.ps1 -Exe ./backupclaude-e2e.exe
