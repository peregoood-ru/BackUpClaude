version: 2

project_name: backupclaude

builds:
  - id: backupclaude
    main: ./cmd/backupclaude
    binary: backupclaude
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      # restic has no Windows arm64 build to pin.
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - NOTICE
      - README.md
      - README.ru.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  draft: true
  prerelease: auto
